name: Submit Slurm Job

on:
  push:
    branches: ["main"]

jobs:
  submit-job-to-slurm:
    runs-on: [self-hosted]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Slurm connectivity
        run: |
          set -euo pipefail
          echo "HOSTNAME=$(hostname)"
          echo "SLURM_CONF=${SLURM_CONF:-<unset>}"
          which sbatch
          scontrol ping
          sinfo >/dev/null
        shell: bash
        
      - name: Prepare Titanic data
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: | 
          export KAGGLE_API_TOKEN=$KAGGLE_KEY
          cd sota/Titanic || exit 1 
          uv run kaggle competitions list -s titanic
          if [ ! -f "data/train.csv" ]; then
            (
              chmod +x pull_data.sh
              uv run ./pull_data.sh
            )
          fi

          if [ ! -f "data/processed_train.csv" ]; then
            uv run python preprocess.py
            
          fi
        shell: bash

      - name: Submit job to Slurm
        run: |
          JOB_ID=$(sbatch --parsable slurm-submit-test.sh)
          echo "JOB_ID=$JOB_ID" >> "$GITHUB_ENV"
          echo "Submitted Slurm job: $JOB_ID"
        shell: bash

      - name: Monitor Slurm job status
        run: |
          while squeue -j "$JOB_ID" | grep -q "$JOB_ID"; do
            echo "Job $JOB_ID still running. Waiting 30 seconds..."
            sleep 30
          done
          pace-job-summary "$JOB_ID" || true
          echo "Job $JOB_ID finished."
        shell: bash

      - name: Verify job success
        run: |
          JOB_STATE=$(sacct -j "$JOB_ID" --format=State --noheader | head -n 1 | xargs)
          echo "State: $JOB_STATE"

          if [[ "$JOB_STATE" == "COMPLETED" ]]; then
            echo "Job $JOB_ID completed successfully."
          else
            echo "Job $JOB_ID failed with state: $JOB_STATE"
            exit 1
          fi
        shell: bash

      - name: Print test results
        if: always()
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET, sys, os

          report = "tests/results/report.xml"
          if not os.path.exists(report):
              print(f"No report found at {report}")
              sys.exit(0)

          root = ET.parse(report).getroot()
          results = {"failed": [], "skipped": [], "passed": 0}

          for tc in root.iter("testcase"):
              name = tc.get("classname", "") + "::" + tc.get("name", "")
              failure = tc.find("failure")
              error   = tc.find("error")
              skipped = tc.find("skipped")

              if failure is not None or error is not None:
                  node = failure if failure is not None else error
                  results["failed"].append((name, node))
              elif skipped is not None:
                  results["skipped"].append((name, skipped.get("message", "No reason given")))
              else:
                  results["passed"] += 1

          print(f"Passed:  {results['passed']}")
          print(f"Skipped: {len(results['skipped'])}")
          print(f"Failed:  {len(results['failed'])}\n")

          if results["skipped"]:
              print("===== Skipped Tests =====")
              for name, reason in results["skipped"]:
                  print(f"SKIPPED: {name}")
                  print(f"  Reason: {reason}")
              print()

          if results["failed"]:
              print("===== Failed Tests =====")
              for name, node in results["failed"]:
                  print(f"FAILED: {name}")
                  if node.get("message"): print(f"  Message : {node.get('message')}")
                  if node.text:           print(f"  Detail  :\n{node.text.strip()}")
                  print()
              sys.exit(1)
          EOF
        shell: bash


      - name: Upload XML report
        if: always()
        uses: actions/upload-artifact@v3-node20
        with:
          name: junit-report
          path: tests/results/report.xml



