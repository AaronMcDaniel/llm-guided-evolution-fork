name: Publish XML report history to GitHub Pages

on:
  workflow_run:
    workflows: ["Submit Slurm Job"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: self-hosted

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitHub CLI
        uses: actions4gh/setup-gh@v1

      - name: Check gh
        run: gh --version

      - name: Download artifact from triggering workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p downloaded-report
          gh run download "${{ github.event.workflow_run.id }}" \
            -n junit-report \
            -D downloaded-report

      - name: Inspect downloaded files
        shell: bash
        run: |
          ls -R downloaded-report
          test -f downloaded-report/report.xml

      - name: Collect metadata from triggering run
        id: meta
        shell: bash
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          EVENT_JSON: ${{ toJson(github.event.workflow_run) }}
        run: |
          UTC_TIME="$(date -u +'%Y-%m-%d_%H-%M-%S')"
          DISPLAY_TIME="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          RUN_DIR="runs/${UTC_TIME}_run-${RUN_NUMBER}"

          COMMIT_TITLE="$(git log -1 --pretty=%s "$HEAD_SHA")"
          COMMIT_MESSAGE="$(git log -1 --pretty=%B "$HEAD_SHA")"
          COMMIT_SHORT_SHA="$(git rev-parse --short "$HEAD_SHA")"

          {
            echo "utc_time=$UTC_TIME"
            echo "display_time=$DISPLAY_TIME"
            echo "run_dir=$RUN_DIR"
            echo "commit_title<<EOF"
            echo "$COMMIT_TITLE"
            echo "EOF"
            echo "commit_message<<EOF"
            echo "$COMMIT_MESSAGE"
            echo "EOF"
            echo "commit_short_sha=$COMMIT_SHORT_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Initialize gh-pages if missing
        shell: bash
        run: |
          if [ ! -d gh-pages/.git ]; then
            rm -rf gh-pages
            mkdir gh-pages
            cd gh-pages
            git init
            git checkout -b gh-pages
          fi

      - name: Copy report and rebuild Pages index
        shell: bash
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          DISPLAY_TIME: ${{ steps.meta.outputs.display_time }}
          RUN_DIR: ${{ steps.meta.outputs.run_dir }}
          COMMIT_TITLE: ${{ steps.meta.outputs.commit_title }}
          COMMIT_MESSAGE: ${{ steps.meta.outputs.commit_message }}
          COMMIT_SHORT_SHA: ${{ steps.meta.outputs.commit_short_sha }}
        run: |
          mkdir -p "gh-pages/${RUN_DIR}"
          cp downloaded-report/report.xml "gh-pages/${RUN_DIR}/report.xml"

          cat > "gh-pages/${RUN_DIR}/metadata.json" <<EOF
          {
            "time": "${DISPLAY_TIME}",
            "user": "${ACTOR}",
            "run_id": "${RUN_ID}",
            "run_number": "${RUN_NUMBER}",
            "commit_sha": "${HEAD_SHA}",
            "commit_short_sha": "${COMMIT_SHORT_SHA}",
            "commit_title": $(python3 -c 'import json,os; print(json.dumps(os.environ["COMMIT_TITLE"]))'),
            "commit_message": $(python3 -c 'import json,os; print(json.dumps(os.environ["COMMIT_MESSAGE"]))'),
            "report_path": "${RUN_DIR}/report.xml",
            "actions_url": "${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}",
            "commit_url": "${SERVER_URL}/${REPO}/commit/${HEAD_SHA}"
          }
          EOF

          python3 <<'PY'
          import json, html
          from pathlib import Path

          root = Path("gh-pages")
          runs_dir = root / "runs"
          runs_dir.mkdir(parents=True, exist_ok=True)

          entries = []
          for p in sorted(runs_dir.glob("*"), reverse=True):
              meta = p / "metadata.json"
              if meta.exists():
                  entries.append(json.loads(meta.read_text()))

          rows = []
          for item in entries:
              rows.append(f"""
              <tr>
                <td>{html.escape(item["time"])}</td>
                <td>{html.escape(item["user"])}</td>
                <td><a href="{html.escape(item["commit_url"])}">{html.escape(item["commit_short_sha"])}</a></td>
                <td>{html.escape(item["commit_title"])}</td>
                <td><pre style="white-space:pre-wrap;margin:0">{html.escape(item["commit_message"])}</pre></td>
                <td><a href="{html.escape(item["actions_url"])}">run {html.escape(str(item["run_number"]))}</a></td>
                <td><a href="{html.escape(item["report_path"])}">xml</a></td>
              </tr>
              """)

          html_page = f"""<!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Workflow Report History</title>
          </head>
          <body>
            <h1>Workflow Report History</h1>
            <p>Total runs stored: {len(entries)}</p>
            <table border="1" cellpadding="6" cellspacing="0">
              <thead>
                <tr>
                  <th>Date / Time</th>
                  <th>User</th>
                  <th>Commit</th>
                  <th>Commit title</th>
                  <th>Commit message</th>
                  <th>Actions run</th>
                  <th>XML report</th>
                </tr>
              </thead>
              <tbody>
                {''.join(rows)}
              </tbody>
            </table>
          </body>
          </html>
          """
          (root / "index.html").write_text(html_page, encoding="utf-8")
          (root / ".nojekyll").write_text("", encoding="utf-8")
          PY

      - name: Commit and push site history
        shell: bash
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && exit 0
          git commit -m "Add report for run ${{ github.event.workflow_run.run_number }}"
          git pull --rebase origin gh-pages || true
          git push origin HEAD:gh-pages